<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VNPT eKYC</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #fff; }
      #ekyc_sdk_intergrated { min-height: 100%; width: 100%; }
      .boot { padding: 24px; color: #475569; font-size: 14px; }
    </style>
    <script>
      (function () {
        var orig = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          if (url.indexOf("vnpt.vn") === -1) return orig.apply(this, arguments);
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 40000);
          var next = Object.assign({}, init || {}, { signal: ctrl.signal });
          return orig.call(window, input, next).then(function (res) {
            clearTimeout(timer);
            if (res.status === 401 || res.status === 403) {
              res.clone().json().then(function (data) {
                var reason = String((data && (data.error || data.message)) || "");
                var message = reason.toLowerCase().indexOf("deactive") >= 0 || reason.toLowerCase().indexOf("token id") >= 0
                  ? "Token ID của VNPT đã bị khóa. Hãy copy lại Token ID, Token Key và Access Token mới cùng lúc, rồi chạy lại API."
                  : "VNPT từ chối bộ token. Hãy lấy Token ID, Token Key và Access Token mới cùng lúc.";
                parent.postMessage({ type: "VNPT_ERROR", message: message }, "*");
              }).catch(function () {
                parent.postMessage({ type: "VNPT_ERROR", message: "VNPT từ chối bộ token. Hãy lấy Token ID, Token Key và Access Token mới cùng lúc." }, "*");
              });
            }
            return res;
          }, function (err) {
            clearTimeout(timer);
            parent.postMessage({ type: "VNPT_ERROR", message: "VNPT không phản hồi sau khi nhận ảnh. Đóng máy quét và thử lại." }, "*");
            return Promise.reject(err);
          });
        };
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.4/lottie.min.js"></script>
    <script src="./lib/VNPTBrowserSDKAppV4.1.0.js"></script>
    <script src="./web-sdk-version-3.0.js"></script>
  </head>
  <body>
    <div id="ekyc_sdk_intergrated">
      <p class="boot">Đang tải giao diện VNPT eKYC…</p>
    </div>
    <script>
      function ready() {
        parent.postMessage({ type: "VNPT_READY" }, "*");
      }
      window.addEventListener("message", function (event) {
        var data = event.data || {};
        if (data.type === "VNPT_PING") {
          ready();
          return;
        }
        if (data.type !== "VNPT_LAUNCH") return;
        if (!window.SDK || typeof window.SDK.launch !== "function") {
          parent.postMessage({ type: "VNPT_ERROR", message: "Không tải được SDK VNPT." }, "*");
          return;
        }
        var raw = data.config || {};
        var token = String(raw.AUTHORIZION || "").trim();
        if (token.toLowerCase().indexOf("bearer ") === 0) token = token.slice(7).trim();
        var cfg = Object.assign({}, raw, { AUTHORIZION: token }, {
          HAS_QR_SCAN: false,
          SHOW_TAB_RESULT_QRCODE: false,
          LIST_TYPE_DOCUMENT: [-1],
          DOCUMENT_TYPE_START: -1,
          URL_WEB_OVAL: "./lib/web-oval.json",
          URL_MOBILE_OVAL: "./lib/mobile-oval.json",
          CALL_BACK_END_FLOW: function (result) {
            parent.postMessage({ type: "VNPT_RESULT", result: result }, "*");
          },
        });
        window.SDK.launch(cfg);
      });
      if (document.readyState === "complete") ready();
      else window.addEventListener("load", ready);
    </script>
  </body>
</html>
